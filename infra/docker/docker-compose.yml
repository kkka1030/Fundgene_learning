services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fundgene
      POSTGRES_PASSWORD: fundgene
      POSTGRES_DB: fundgene
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  postgres-data:
